<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>رضا عباس اصغر - اشتراک فایل</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;700;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
:root{
--bg:#0f0f1e;--card:#1a1a2e;--card2:#252542;
--primary:#7c3aed;--primary2:#a78bfa;
--text:#fff;--muted:rgba(255,255,255,.6);
--success:#10b981;--danger:#ef4444;--warning:#f59e0b;
}
body{font-family:'Vazirmatn',sans-serif;background:var(--bg);color:var(--text);min-height:100vh}

.header{background:linear-gradient(135deg,var(--primary),var(--primary2));padding:40px 20px;text-align:center;position:relative;overflow:hidden}
.header::before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 20% 50%,rgba(255,255,255,.1) 0%,transparent 50%);pointer-events:none}
.header h1{font-size:42px;font-weight:900;margin-bottom:10px;position:relative;z-index:1}
.header p{color:rgba(255,255,255,.9);font-size:16px;position:relative;z-index:1}
.header .emoji{font-size:60px;margin-bottom:15px;display:block}

.container{max-width:1200px;margin:0 auto;padding:30px 20px}

.upload-box{background:var(--card);border-radius:20px;padding:30px;margin-bottom:30px;border:2px dashed var(--primary);text-align:center;transition:.3s}
.upload-box:hover{border-color:var(--primary2);background:var(--card2);transform:translateY(-3px)}
.upload-box.dragging{border-color:var(--success);background:rgba(16,185,129,.1)}
.upload-icon{font-size:70px;margin-bottom:15px;opacity:.8}
.upload-box h2{color:var(--primary2);margin-bottom:10px;font-size:24px}
.upload-box p{color:var(--muted);margin-bottom:20px;font-size:14px}
.upload-input{display:none}
.upload-btn{background:linear-gradient(135deg,var(--primary),var(--primary2));color:white;border:none;padding:15px 40px;border-radius:50px;font-family:'Vazirmatn';font-size:16px;font-weight:700;cursor:pointer;transition:.3s;box-shadow:0 5px 20px rgba(124,58,237,.4)}
.upload-btn:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(124,58,237,.6)}
.upload-btn:disabled{opacity:.5;cursor:not-allowed}

.name-input{width:100%;max-width:400px;padding:15px 20px;border-radius:50px;border:2px solid var(--primary);background:var(--card2);color:white;font-family:'Vazirmatn';font-size:14px;margin-bottom:20px;text-align:center}
.name-input:focus{outline:none;border-color:var(--primary2)}

.progress-bar{width:100%;max-width:400px;margin:20px auto;height:8px;background:var(--card2);border-radius:10px;overflow:hidden;display:none}
.progress-bar.show{display:block}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--primary),var(--primary2));width:0%;transition:.3s;border-radius:10px}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:15px;margin-bottom:30px}
.stat-card{background:var(--card);padding:20px;border-radius:15px;text-align:center;border:1px solid rgba(124,58,237,.2);transition:.3s}
.stat-card:hover{transform:translateY(-3px);border-color:var(--primary)}
.stat-card .icon{font-size:35px;margin-bottom:10px}
.stat-card .num{font-size:28px;font-weight:900;color:var(--primary2);margin-bottom:5px}
.stat-card .label{color:var(--muted);font-size:13px}

.filter-bar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center}
.filter-btn{background:var(--card);border:1px solid rgba(124,58,237,.3);color:white;padding:10px 20px;border-radius:30px;cursor:pointer;font-family:'Vazirmatn';font-size:13px;transition:.3s}
.filter-btn:hover,.filter-btn.active{background:var(--primary);border-color:var(--primary)}
.search-box{flex:1;min-width:200px;padding:10px 20px;border-radius:30px;border:1px solid rgba(124,58,237,.3);background:var(--card);color:white;font-family:'Vazirmatn';font-size:14px}
.search-box:focus{outline:none;border-color:var(--primary)}

.files-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:20px}
.file-card{background:var(--card);border-radius:15px;overflow:hidden;transition:.3s;border:1px solid rgba(124,58,237,.15);position:relative}
.file-card:hover{transform:translateY(-5px);border-color:var(--primary);box-shadow:0 10px 30px rgba(124,58,237,.2)}
.file-preview{width:100%;height:180px;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:60px;position:relative;overflow:hidden}
.file-preview img{width:100%;height:100%;object-fit:cover}
.file-preview video{width:100%;height:100%;object-fit:cover}
.file-info{padding:15px}
.file-name{font-size:13px;font-weight:700;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:white}
.file-meta{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-bottom:10px}
.file-actions{display:flex;gap:8px}
.file-btn{flex:1;padding:8px;border:none;border-radius:8px;cursor:pointer;font-family:'Vazirmatn';font-size:12px;font-weight:700;transition:.3s}
.btn-download{background:var(--primary);color:white}
.btn-download:hover{background:var(--primary2)}
.btn-copy{background:var(--card2);color:white;border:1px solid rgba(255,255,255,.1)}
.btn-copy:hover{background:var(--success)}
.btn-delete{background:var(--danger);color:white}

.uploader-badge{position:absolute;top:10px;right:10px;background:rgba(0,0,0,.7);backdrop-filter:blur(5px);padding:4px 10px;border-radius:20px;font-size:11px;color:white}

.empty-state{text-align:center;padding:80px 20px;color:var(--muted)}
.empty-state .emoji{font-size:80px;margin-bottom:20px;opacity:.5}
.empty-state h3{color:white;margin-bottom:10px}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-100px);background:var(--success);color:white;padding:15px 30px;border-radius:10px;font-size:14px;font-weight:700;z-index:9999;transition:.5s;font-family:'Vazirmatn';box-shadow:0 10px 30px rgba(0,0,0,.3)}
.toast.show{transform:translateX(-50%) translateY(0)}

.modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);z-index:10000;align-items:center;justify-content:center;padding:20px}
.modal.show{display:flex}
.modal-content{max-width:90%;max-height:90%;position:relative}
.modal img,.modal video{max-width:100%;max-height:80vh;border-radius:10px}
.modal-close{position:absolute;top:-40px;right:0;background:var(--danger);color:white;border:none;width:35px;height:35px;border-radius:50%;cursor:pointer;font-size:18px;font-weight:700}

footer{text-align:center;padding:30px;color:var(--muted);font-size:13px;border-top:1px solid rgba(124,58,237,.1);margin-top:50px}
footer .heart{color:var(--danger)}

@media (max-width:768px){
.header h1{font-size:32px}
.upload-icon{font-size:50px}
.files-grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:15px}
.file-preview{height:140px;font-size:45px}
}
</style>
</head>
<body>

<div class="toast" id="toast"></div>

<div class="header">
<span class="emoji">🎬</span>
<h1>رضا عباس اصغر</h1>
<p>مکانی برای اشتراک فایل بین ما رفقا 💜</p>
</div>

<div class="container">

<div class="upload-box" id="uploadBox">
<div class="upload-icon">📤</div>
<h2>فایل جدید آپلود کن</h2>
<p>عکس، ویدیو، سند یا هر چیز دیگه (تا 100MB)</p>
<input type="text" class="name-input" id="uploaderName" placeholder="اسمت رو بنویس (مثلاً: رضا)">
<input type="file" class="upload-input" id="fileInput" multiple>
<button class="upload-btn" onclick="document.getElementById('fileInput').click()">
📁 انتخاب فایل
</button>
<div class="progress-bar" id="progressBar">
<div class="progress-fill" id="progressFill"></div>
</div>
</div>

<div class="stats">
<div class="stat-card">
<div class="icon">📁</div>
<div class="num" id="statTotal">0</div>
<div class="label">کل فایل‌ها</div>
</div>
<div class="stat-card">
<div class="icon">📸</div>
<div class="num" id="statImages">0</div>
<div class="label">عکس‌ها</div>
</div>
<div class="stat-card">
<div class="icon">🎥</div>
<div class="num" id="statVideos">0</div>
<div class="label">ویدیوها</div>
</div>
<div class="stat-card">
<div class="icon">📄</div>
<div class="num" id="statDocs">0</div>
<div class="label">سایر</div>
</div>
</div>

<div class="filter-bar">
<button class="filter-btn active" onclick="filterFiles('all',this)">🌐 همه</button>
<button class="filter-btn" onclick="filterFiles('image',this)">📸 عکس</button>
<button class="filter-btn" onclick="filterFiles('video',this)">🎥 ویدیو</button>
<button class="filter-btn" onclick="filterFiles('other',this)">📄 سایر</button>
<input type="text" class="search-box" id="searchBox" placeholder="🔍 جستجو..." oninput="renderFiles()">
</div>

<div id="filesContainer"></div>

</div>

<div class="modal" id="modal" onclick="if(event.target===this)closeModal()">
<div class="modal-content">
<button class="modal-close" onclick="closeModal()">✕</button>
<div id="modalBody"></div>
</div>
</div>

<footer>
ساخته شده با <span class="heart">❤️</span> برای رضا، عباس، اصغر
</footer>

<script>
const CLOUD_NAME = 'xnlftvsq';
const UPLOAD_PRESET = 'reza_abbas_asghar';

let files = JSON.parse(localStorage.getItem('rezaFiles')) || [];
let currentFilter = 'all';

function saveFiles(){ localStorage.setItem('rezaFiles', JSON.stringify(files)); }

function showToast(msg, color='#10b981'){
const t = document.getElementById('toast');
t.textContent = msg;
t.style.background = color;
t.classList.add('show');
setTimeout(()=>t.classList.remove('show'), 3000);
}

function getFileType(url){
const ext = url.split('.').pop().toLowerCase();
if(['jpg','jpeg','png','gif','webp','bmp','svg'].includes(ext)) return 'image';
if(['mp4','webm','mov','avi','mkv'].includes(ext)) return 'video';
return 'other';
}

function getFileIcon(type,name){
if(type==='image')return '📸';
if(type==='video')return '🎥';
const ext = name.split('.').pop().toLowerCase();
if(['pdf'].includes(ext))return '📕';
if(['doc','docx'].includes(ext))return '📘';
if(['xls','xlsx'].includes(ext))return '📗';
if(['zip','rar','7z'].includes(ext))return '📦';
if(['mp3','wav','ogg'].includes(ext))return '🎵';
return '📄';
}

function formatSize(bytes){
if(bytes<1024)return bytes+' B';
if(bytes<1048576)return (bytes/1024).toFixed(1)+' KB';
if(bytes<1073741824)return (bytes/1048576).toFixed(1)+' MB';
return (bytes/1073741824).toFixed(1)+' GB';
}

async function uploadFile(file){
const uploaderName = document.getElementById('uploaderName').value.trim() || 'ناشناس';
const progressBar = document.getElementById('progressBar');
const progressFill = document.getElementById('progressFill');

progressBar.classList.add('show');
progressFill.style.width = '10%';

const formData = new FormData();
formData.append('file', file);
formData.append('upload_preset', UPLOAD_PRESET);

const isVideo = file.type.startsWith('video/');
const resourceType = isVideo ? 'video' : file.type.startsWith('image/') ? 'image' : 'raw';

try{
progressFill.style.width = '50%';
const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/${resourceType}/upload`, {
method: 'POST',
body: formData
});

progressFill.style.width = '90%';
const data = await response.json();

if(data.secure_url){
files.unshift({
id: Date.now(),
name: file.name,
url: data.secure_url,
size: file.size,
type: getFileType(data.secure_url),
uploader: uploaderName,
date: new Date().toLocaleString('fa-IR')
});
saveFiles();
renderFiles();
progressFill.style.width = '100%';
showToast('✅ فایل با موفقیت آپلود شد!');
setTimeout(()=>{
progressBar.classList.remove('show');
progressFill.style.width = '0%';
}, 1000);
} else {
throw new Error(data.error?.message || 'خطای نامشخص');
}
} catch(err){
showToast('❌ خطا در آپلود: '+err.message, '#ef4444');
progressBar.classList.remove('show');
progressFill.style.width = '0%';
}
}

document.getElementById('fileInput').addEventListener('change', async (e)=>{
for(let file of e.target.files){
if(file.size > 100*1024*1024){
showToast('❌ حجم فایل نباید بیشتر از 100MB باشه', '#ef4444');
continue;
}
await uploadFile(file);
}
e.target.value = '';
});

const uploadBox = document.getElementById('uploadBox');
uploadBox.addEventListener('dragover', e=>{ e.preventDefault(); uploadBox.classList.add('dragging'); });
uploadBox.addEventListener('dragleave', ()=>uploadBox.classList.remove('dragging'));
uploadBox.addEventListener('drop', async e=>{
e.preventDefault();
uploadBox.classList.remove('dragging');
for(let file of e.dataTransfer.files){
if(file.size > 100*1024*1024){
showToast('❌ حجم فایل نباید بیشتر از 100MB باشه', '#ef4444');
continue;
}
await uploadFile(file);
}
});

function filterFiles(type, btn){
document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
btn.classList.add('active');
currentFilter = type;
renderFiles();
}

function renderFiles(){
const container = document.getElementById('filesContainer');
const search = document.getElementById('searchBox').value.toLowerCase();

let filtered = files.filter(f=>{
const matchType = currentFilter === 'all' || f.type === currentFilter;
const matchSearch = f.name.toLowerCase().includes(search) || f.uploader.toLowerCase().includes(search);
return matchType && matchSearch;
});

document.getElementById('statTotal').textContent = files.length;
document.getElementById('statImages').textContent = files.filter(f=>f.type==='image').length;
document.getElementById('statVideos').textContent = files.filter(f=>f.type==='video').length;
document.getElementById('statDocs').textContent = files.filter(f=>f.type==='other').length;

if(filtered.length === 0){
container.innerHTML = `
<div class="empty-state">
<div class="emoji">📂</div>
<h3>فایلی پیدا نشد</h3>
<p>فایل جدید آپلود کن یا فیلترها رو تغییر بده</p>
</div>`;
return;
}

container.innerHTML = '<div class="files-grid">' + filtered.map(f=>{
let preview = '';
if(f.type === 'image'){
preview = `<img src="${f.url}" alt="${f.name}" onclick="openModal('image','${f.url}')">`;
} else if(f.type === 'video'){
preview = `<video src="${f.url}" onclick="openModal('video','${f.url}')"></video>`;
} else {
preview = getFileIcon(f.type, f.name);
}

return `
<div class="file-card">
<div class="file-preview">
${preview}
<div class="uploader-badge">👤 ${f.uploader}</div>
</div>
<div class="file-info">
<div class="file-name" title="${f.name}">${f.name}</div>
<div class="file-meta">
<span>${formatSize(f.size)}</span>
<span>${f.date.split(',')[0]}</span>
</div>
<div class="file-actions">
<a href="${f.url}" download="${f.name}" target="_blank" class="file-btn btn-download" style="text-decoration:none;text-align:center">⬇️ دانلود</a>
<button class="file-btn btn-copy" onclick="copyLink('${f.url}')">🔗 کپی</button>
<button class="file-btn btn-delete" onclick="deleteFile(${f.id})">🗑️</button>
</div>
</div>
</div>`;
}).join('') + '</div>';
}

function copyLink(url){
navigator.clipboard.writeText(url).then(()=>{
showToast('🔗 لینک کپی شد!');
});
}

function deleteFile(id){
if(!confirm('مطمئنی می‌خوای این فایل رو از لیست حذف کنی؟\n(از سرور پاک نمی‌شه، فقط از این لیست)')) return;
files = files.filter(f=>f.id !== id);
saveFiles();
renderFiles();
showToast('🗑️ فایل حذف شد');
}

function openModal(type, url){
const modal = document.getElementById('modal');
const body = document.getElementById('modalBody');
if(type === 'image'){
body.innerHTML = `<img src="${url}">`;
} else {
body.innerHTML = `<video src="${url}" controls autoplay></video>`;
}
modal.classList.add('show');
}

function closeModal(){
document.getElementById('modal').classList.remove('show');
document.getElementById('modalBody').innerHTML = '';
}

renderFiles();
</script>

</body>
</html>
